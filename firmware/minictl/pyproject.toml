[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minictl"
version = "0.1.0"
description = "The minichord from the command line: settings, banks, backups, presets from words, notes, flashing"
requires-python = ">=3.9"
dependencies = ["python-rtmidi>=1.5"]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
audio = ["sounddevice>=0.4"]
all = ["pyserial>=3.5", "sounddevice>=0.4"]

[project.scripts]
minictl = "minictl.cli:main"

[tool.setuptools]
packages = ["minictl"]

[tool.setuptools.package-data]
minictl = ["options.json"]
