; The updater and its boot-switch spike (include/boot_switch.h says what they are). Two programs:
;   updater       runs from its slot at 0x601E1000 (updater.ld) once the boot pointer names it
;   switch_test   a stand-in firmware that carries the updater (scripts/embed_updater.py) and flips the switch
; Build with build.sh, which builds the updater first, then the app, then runs scripts/check_spike.py. Only
; switch_test's firmware.hex is ever flashed; the updater reaches the minichord inside it.

[platformio]
default_envs = updater, switch_test

[env]
platform = teensy
board = teensy40
framework = arduino
build_flags = -D USB_MIDI_SERIAL
; Never `pio run -t upload` here: the updater's hex lies all at 0x601E1000 and up, and the Teensy's bootloader
; erases the 64 kB blocks an image reaches, which would take the kit's header and the presets with it. The
; app goes on through the bench (~/minichord-bench/boot_switch_test.py flash-app), at Greg's yes. With
; protocol custom the platform runs only this command (its builder/main.py), which says so and fails.
upload_protocol = custom
upload_command = echo "Not from here: the switch-test app goes on with ~/minichord-bench/boot_switch_test.py flash-app --yes, at Greg's yes" && false

[env:updater]
board_build.ldscript = updater.ld
build_src_filter = +<updater/>

[env:switch_test]
build_src_filter = +<switch_test/>
extra_scripts = pre:scripts/embed_updater.py
